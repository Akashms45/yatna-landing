<!DOCTYPE html>

<body>
<svg width='900' height='550' viewBox='0 0 900 550'>
  <defs>
    <path id='p1' d='M 250 450 A 200 200 0 0 1 650 450' fill='none' stroke='#C79A45' stroke-width='0.5' />
    <path id='p2' d='M 680 450 A 230 230 0 0 0 220 450' fill='none' stroke='#C79A45' stroke-width='0.5' />
  </defs>
  <text font-size='9' fill='#742C25' font-family='serif' font-weight='600'>
    <textPath href='#p1'>ಜಯ ಹನುಮಾನ ಜ್ಞಾನ ಗುಣ ಸಾಗರ । ಜಯ ಕಪೀಶ ತಿಹು ಲೋಕ ಉಜಾಗರ ॥ 1 ॥</textPath>
  </text>
  <text font-size='9' fill='#742C25' font-family='serif' font-weight='600'>
    <textPath href='#p2' side='right'>ರಾಮದೂತ ಅತುಲಿತ ಬಲಧಾಮಾ । ಅಂಜನಿ ಪುತ್ರ ಪವನಸುತ ನಾಮಾ ॥ 2 ॥</textPath>
  </text>
